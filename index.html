<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="description" content="Hier gibt es noch nichts. Aber du kannst trotzdem ein bisschen bleiben." />
<title>Hier gibt es noch nichts.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="fields">
      <div class="room room-a"></div>
      <div class="room room-b"></div>
      <div class="room room-c"></div>
      <div class="room room-d"></div>
      <div class="room room-e"></div>
    </div>
    <div class="cursor-light" id="cursorLight"></div>
    <div class="touch-light" id="touchLight"></div>
    <div class="grain"></div>
  </div>

  <main class="stage">
    <div class="text-wrap">
      <h1 class="headline" id="headline"></h1>
      <p class="subline" id="subline"></p>
    </div>

    <div class="action" id="action">
      <button class="action-btn" id="actionBtn" type="button">
        <span class="action-label" id="actionLabel"></span>
        <span class="action-arrow" aria-hidden="true">&rarr;</span>
      </button>
      <p class="idle-hint" id="idleHint" aria-live="polite"></p>
    </div>

    <div class="epilogue" id="epilogue" aria-live="polite">
      <p class="epilogue-line epilogue-line--1" id="epilogueLine1"></p>
      <p class="epilogue-line epilogue-line--2" id="epilogueLine2"></p>
      <p class="epilogue-line epilogue-line--3" id="epilogueLine3"></p>
    </div>
  </main>

<script src="script.js" defer></script>
</body>
</html>
