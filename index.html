<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Hier gibt es noch nichts. Aber du kannst trotzdem ein bisschen bleiben." />
<title>Hier gibt es noch nichts.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <button class="brand" id="brand" type="button" aria-label="Jessica Meysel — zurück zum Anfang">
    <span class="brand-mark">JM</span>
  </button>

  <button class="menu-trigger" id="menuTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="siteMenu" aria-label="Menü öffnen">
    <span class="menu-icon" aria-hidden="true">
      <span class="menu-line menu-line--1"></span>
      <span class="menu-line menu-line--2"></span>
    </span>
  </button>

  <div class="scene" id="scene" aria-hidden="true">
    <div class="drift-wrap drift-wrap--a"><div class="ambient ambient-1"></div></div>
    <div class="drift-wrap drift-wrap--b"><div class="ambient ambient-2"></div></div>

    <div class="drift-wrap drift-wrap--sculpture"><div class="sculpture" id="sculpture">
      <svg class="sculpture-layer sculpture-layer--1" viewBox="0 0 600 600" aria-hidden="true">
        <defs>
          <radialGradient id="grad1" cx="42%" cy="38%" r="88%">
            <stop offset="0%" stop-color="#c7a4f4" stop-opacity="0.95" />
            <stop offset="35%" stop-color="#c7a4f4" stop-opacity="0.75" />
            <stop offset="68%" stop-color="#8d5bc5" stop-opacity="0.42" />
            <stop offset="100%" stop-color="#4d2868" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path d="M300,60 C420,50 520,140 540,260 C560,380 480,480 360,520 C260,555 120,520 70,420 C20,320 60,180 160,110 C210,75 250,65 300,60 Z" fill="url(#grad1)" />
      </svg>
      <svg class="sculpture-layer sculpture-layer--2" viewBox="0 0 600 600" aria-hidden="true">
        <defs>
          <radialGradient id="grad2" cx="55%" cy="55%" r="85%">
            <stop offset="0%" stop-color="#b88bea" stop-opacity="0.9" />
            <stop offset="35%" stop-color="#b88bea" stop-opacity="0.68" />
            <stop offset="68%" stop-color="#4d2868" stop-opacity="0.38" />
            <stop offset="100%" stop-color="#291533" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path d="M80,300 C60,180 180,80 320,90 C460,100 560,200 540,320 C520,440 400,520 280,500 C160,480 100,420 80,300 Z" fill="url(#grad2)" />
      </svg>
      <svg class="sculpture-layer sculpture-layer--3" viewBox="0 0 600 600" aria-hidden="true">
        <defs>
          <radialGradient id="grad3" cx="48%" cy="45%" r="82%">
            <stop offset="0%" stop-color="#f5f0f7" stop-opacity="0.85" />
            <stop offset="32%" stop-color="#f5f0f7" stop-opacity="0.55" />
            <stop offset="65%" stop-color="#c7a4f4" stop-opacity="0.32" />
            <stop offset="100%" stop-color="#8d5bc5" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path d="M320,40 C440,20 560,120 560,240 C560,340 500,400 460,460 C420,520 340,560 260,540 C180,520 120,460 90,380 C60,300 80,200 150,140 C210,90 260,55 320,40 Z" fill="url(#grad3)" />
      </svg>
    </div></div>

    <div class="story-light" id="storyLight"></div>
    <div class="spark" id="spark" aria-hidden="true"></div>
    <div class="ghost-rect ghost-rect--outline" id="ghostOutline" aria-hidden="true"></div>
    <div class="ghost-rect ghost-rect--fill" id="ghostFill" aria-hidden="true"></div>

    <div class="cursor-light" id="cursorLight"></div>
    <div class="touch-light" id="touchLight"></div>
    <div class="grain"></div>
  </div>

  <p class="scroll-hint" id="scrollHint" aria-live="polite"></p>

  <main class="stage">
    <div class="text-wrap" id="textWrap">
      <p class="greeting" id="greeting"></p>
      <h1 class="headline" id="headline"></h1>
      <p class="subline" id="subline"></p>

      <div class="action" id="action">
        <button class="action-btn" id="actionBtn" type="button">
          <span class="action-label" id="actionLabel"></span>
          <span class="action-arrow" aria-hidden="true">&rarr;</span>
        </button>
        <p class="idle-hint" id="idleHint" aria-live="polite"></p>
      </div>

      <div class="epilogue" id="epilogue" aria-live="polite">
        <p class="epilogue-line epilogue-line--1" id="epilogueLine1"></p>
        <p class="epilogue-line epilogue-line--2" id="epilogueLine2"></p>
      </div>
    </div>
  </main>

  <div class="site-menu" id="siteMenu" aria-hidden="true" inert>
    <div class="site-menu-scrim" id="siteMenuScrim"></div>
    <div class="site-menu-panel" id="siteMenuPanel" role="dialog" aria-modal="true" aria-label="Menü" tabindex="-1">
      <div class="site-menu-ambient-wrap" aria-hidden="true"><div class="site-menu-ambient"></div></div>
      <div class="site-menu-nichts" aria-hidden="true">
        <span class="site-menu-nichts-layer site-menu-nichts-layer--base">NICHTS</span>
        <span class="site-menu-nichts-layer site-menu-nichts-layer--boost" id="siteMenuNichtsBoost">NICHTS</span>
      </div>
      <p class="site-menu-reaction" id="siteMenuEmpty"></p>
      <p class="site-menu-more" id="siteMenuMore" aria-live="polite"></p>
      <p class="site-menu-tap" id="siteMenuTap1" aria-hidden="true"></p>
      <p class="site-menu-tap" id="siteMenuTap2" aria-hidden="true"></p>
      <p class="site-menu-tap" id="siteMenuTap3" aria-hidden="true"></p>
      <p class="site-menu-tap" id="siteMenuTap4" aria-hidden="true"></p>
    </div>
  </div>

<script src="script.js" defer></script>
</body>
</html>
